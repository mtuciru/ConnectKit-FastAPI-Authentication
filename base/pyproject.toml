[project]
name = "ConnectKit-Authentication-FastAPI"
version = "2.0.0"
description = "User accounts and jwt authentication for FastAPI services"
authors = [
    { name = "RealMetamorph", email = "andr.timchuk@yandex.ru" },
]
keywords = ["connectkit", "authentication", "authorization", "jwt", "header", "cookie", "fastapi"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Programming Language :: Python :: 3",
    "Intended Audience :: Developers",
    "Framework :: FastAPI",
    "License :: OSI Approved :: MIT License"
]
requires-python = ">=3.10"
readme = "README.md"
license = { file = "LICENSE" }

dependencies = [
    "ConnectKit-Database>=2.1.1",
    "pydantic>=2.10.6",
    "pydantic-settings>=2.8.1",
    "fastapi>=0.115.11",
    "PyJWT[crypto]>=2.10.1",
    "argon2-cffi>=23.1.0",
    "ietfparse>=1.9.0",
    "pyyaml>=6.0.2"
]

[project.urls]
Homepage = "https://github.com/mtuciru/ConnectKit-FastAPIAuthentication"
Repository = "https://github.com/mtuciru/ConnectKit-FastAPIAuthentication.git"

[project.optional-dependencies]
orjson = [
    "orjson>=3.10.15",
    "ConnectKit-Database[orjson]>=2.1.1",
]

[build-system]
requires = ["pdm-backend"]
build-backend = "pdm.backend"

[tool.pdm.scripts]
tests = "echo 'tests will be here'"

[tool.pdm]
distribution = true


[tool.pdm.dev-dependencies]
dev = [
    "pytest>=8.3.5",
    "pytest-asyncio>=0.25.3",
    "ConnectKit-Database[aiosqlite]>=2.0.1"
]
